version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: nglip
      POSTGRES_USER: nglip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_in_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nglip"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://nglip:${POSTGRES_PASSWORD:-dev_password_change_in_prod}@db:5432/nglip
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORE_PATH: /data
      OLLAMA_URL: http://ollama:11434
      FORECAST_ENABLED: "false"
    volumes:
      - ../data:/data
      - ../backend:/app/backend  # live code mount — no rebuild needed on Python changes
    ports:
      - "8000:8000"

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: >
      celery -A backend.celery_app worker
      --loglevel=info
      --concurrency=4
      -Q orchestrator,gis,celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://nglip:${POSTGRES_PASSWORD:-dev_password_change_in_prod}@db:5432/nglip
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORE_PATH: /data
      OLLAMA_URL: http://ollama:11434
      FORECAST_ENABLED: "false"
    volumes:
      - ../data:/data
      - ../backend:/app/backend  # live code mount — celery auto-restarts via watchdog if needed

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    profiles:
      - narrative
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
  ollama_data:
